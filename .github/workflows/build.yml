# Rebuilds the site whenever something is pushed, so pages (and the sitemap) never
# have to be regenerated by hand. Edit _src/pages/*.md, push, and this commits the
# regenerated HTML back to the same branch.
name: Build site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Only one build at a time; a newer push replaces one that hasn't started yet.
concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r _src/requirements.txt

      - name: Build
        run: python _src/build.py

      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Site already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild site [skip ci]"
          git push
