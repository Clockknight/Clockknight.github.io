# Rebuilds the site whenever something is pushed, so pages (and the sitemap) never
# have to be regenerated by hand. Edit _src/pages/*.md, push, and this commits the
# regenerated HTML back to the branch that was pushed.
#
# Deleting a page works from either side: remove its source in _src/pages/, or just delete
# the generated .html in the repo. The build notices the missing file (it keeps a list of what
# it wrote in _src/manifest.txt), removes the source as well, and drops the page from the sitemap.
name: Build site

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# One build at a time per branch; a newer push replaces one that hasn't started yet.
concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r _src/requirements.txt

      - name: Build
        run: python _src/build.py --prune-deleted

      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Site already up to date."
            exit 0
          fi
          removed="$(git diff --cached --name-only --diff-filter=D -- _src/pages _src/static | sed 's/^/  - /')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$removed" ]; then
            git commit -m "Rebuild site [skip ci]" -m "Removed sources of pages deleted from the site:
          $removed"
          else
            git commit -m "Rebuild site [skip ci]"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
