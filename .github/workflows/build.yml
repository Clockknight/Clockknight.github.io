# Rebuilds the site whenever something is pushed, so pages (and the sitemap) never
# have to be regenerated by hand. Edit _src/pages/*.md, push, and this commits the
# regenerated HTML back to the branch that was pushed.
#
# Each project on the home page (data-source in _src/pages/index.md) is checked for new commits
# (GitHub) or releases (itch.io) on every run, and the tab is marked "Updated" for a month after.
# A daily run keeps that fresh. Note: GitHub only runs scheduled workflows from the repository's
# default branch, so for the daily run to build this branch, this branch has to be the default one.
# Pushes and "Run workflow" always work.
#
# Deleting a page works from either side: remove its source in _src/pages/, or just delete
# the generated .html in the repo. The build notices the missing file (it keeps a list of what
# it wrote in _src/manifest.txt), removes the source as well, and drops the page from the sitemap.
name: Build site

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

# One build at a time per branch; a newer push replaces one that hasn't started yet.
concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so the hand-edit check can compare with the previous push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r _src/requirements.txt

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python _src/build.py --prune-deleted --fetch-updates

      - name: Warn about hand edits to generated files
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          # Generated files (everything outside _src/) are rewritten from _src/ on every build.
          # If this push edited one and the build just reverted it, say so instead of doing it silently.
          pushed="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -v '^_src/\|^\.github/\|^README' || true)"
          for f in $pushed; do
            if [ -e "$f" ] && ! git diff --quiet -- "$f"; then
              echo "::warning file=$f::This generated file was edited by hand and has been rewritten from _src/. Make the change in _src/pages or _src/static instead."
            fi
          done

      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Site already up to date."
            exit 0
          fi
          removed="$(git diff --cached --name-only --diff-filter=D -- _src/pages _src/static | sed 's/^/  - /')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$removed" ]; then
            git commit -m "Rebuild site [skip ci]" -m "Removed sources of pages deleted from the site:
          $removed"
          else
            git commit -m "Rebuild site [skip ci]"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
